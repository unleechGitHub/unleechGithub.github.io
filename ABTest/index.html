const KEY='standoff-icon-test-v2';
const PHASE2_START='2026-08-22T17:35:47.520Z';
const SUPABASE_URL='https://qzjwqoonxflwyckdbelz.supabase.co';
const SUPABASE_KEY='sb_publishable_Yy_xdVPcLWe54N5hKVgCAA_aTU01W4z';
const blank=()=>Object.fromEntries(CANDIDATES.map(c=>[c.id,{wins:0,appearances:0}]));
const makePairs=()=>{const p=[];for(let a=0;a<CANDIDATES.length;a++)for(let b=a+1;b<CANDIDATES.length;b++)p.push(Math.random()>.5?[a,b]:[b,a]);return p.sort(()=>Math.random()-.5)};
let state={pairs:makePairs(),round:0,scores:blank(),results:false};try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.pairs?.length)state=s;if(state.round>=state.pairs.length)state.results=true}catch(e){}
const arena=document.querySelector('#arena'),results=document.querySelector('#results'),toggle=document.querySelector('#toggle');
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function sizes(c){return `<div class="sizes">${[64,32,16].map(n=>`<span class="size"><span class="checker"><img src="${c.src}" width="${n}" height="${n}" alt=""></span><small>${n}px</small></span>`).join('')}</div>`}
function renderVote(){const pair=state.pairs[Math.min(state.round,state.pairs.length-1)];document.querySelector('#round').textContent=`Finalist matchup ${state.round+1} of ${state.pairs.length}`;document.querySelector('#progress').style.width=`${state.round/state.pairs.length*100}%`;document.querySelector('#matchup').innerHTML=pair.map((i,s)=>{const c=CANDIDATES[i];return `<button class="candidate" data-index="${i}"><span class="label">Candidate ${s?'B':'A'}</span><span class="hero"><img src="${c.src}" alt="Candidate ${s?'B':'A'}"></span>${sizes(c)}<strong>Choose this icon</strong></button>`}).join('');document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>vote(+b.dataset.index))}
async function api(path,options={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error('Shared results are temporarily unavailable');return r.status===204?null:r.json()}
async function vote(w){const pair=state.pairs[state.round];if(!pair){state.results=true;save();render();return}const winner=CANDIDATES[w].id,loser=CANDIDATES[pair.find(i=>i!==w)].id;pair.forEach(i=>state.scores[CANDIDATES[i].id].appearances++);state.scores[winner].wins++;if(++state.round>=state.pairs.length)state.results=true;save();render();try{await api('icon_votes',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({winner,loser})})}catch(e){document.querySelector('#status').textContent=e.message}}
async function renderResults(){const board=document.querySelector('#board'),status=document.querySelector('#status');status.textContent='Loading Phase 2 votes…';try{const votes=await api(`icon_votes?select=winner,loser&created_at=gte.${encodeURIComponent(PHASE2_START)}`);const scores=blank();votes.forEach(v=>{if(scores[v.winner]&&scores[v.loser]){scores[v.winner].wins++;scores[v.winner].appearances++;scores[v.loser].appearances++}});const ranked=[...CANDIDATES].sort((a,b)=>{const A=scores[a.id],B=scores[b.id];return (B.appearances?B.wins/B.appearances:0)-(A.appearances?A.wins/A.appearances:0)});board.innerHTML=ranked.map((c,i)=>{const s=scores[c.id],r=s.appearances?Math.round(s.wins/s.appearances*100):0;return `<article class="row"><span class="rank">${i+1}</span><span class="thumb checker"><img src="${c.src}" alt=""></span><div class="copy"><h3>${c.name}</h3><div class="bar"><span style="width:${r}%"></span></div></div><div class="score"><strong>${r}%</strong><small>${s.wins} of ${s.appearances} matchups</small></div></article>`}).join('');status.textContent=`${votes.length} Phase 2 choices · about ${Math.floor(votes.length/3)} completed tests`;document.querySelector('#continue').classList.toggle('hidden',state.round>=state.pairs.length)}catch(e){status.textContent=e.message;board.innerHTML=''}}
function render(){arena.classList.toggle('hidden',state.results);results.classList.toggle('hidden',!state.results);toggle.textContent=state.results?(state.round>=state.pairs.length?'Test complete':'Continue voting'):'View results';toggle.disabled=state.results&&state.round>=state.pairs.length;state.results?renderResults():renderVote()}
function resetTest(){localStorage.removeItem(KEY);state={pairs:makePairs(),round:0,scores:blank(),results:false};render()}
toggle.onclick=()=>{if(state.round>=state.pairs.length)return;state.results=!state.results;save();render()};document.querySelector('#continue').onclick=()=>{state.results=false;save();render()};document.querySelector('#refresh').onclick=renderResults;document.querySelector('#reset').onclick=resetTest;render();
</script></body></html>
